[project]
name = "demo-team-notes-authz"
version = "0.1.0"
description = "Team Notes — demo app showcasing Duar AuthZ mode (dual-token)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "duar-auth[mcp]",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
duar-auth = { path = "../../sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
