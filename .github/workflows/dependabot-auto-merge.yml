name: Dependabot auto-merge

# Patch + minor Dependabot updates (including grouped PRs) merge themselves once
# the required status checks pass. Major bumps are never auto-merged — they wait
# for a human. Gating on checks requires branch protection on main with
# "Allow auto-merge" enabled; see repo settings.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Grouped PRs report the group's highest bump as update-type, so a group
      # containing a major is correctly left for review.
      - name: Enable auto-merge for patch/minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
