name: Publish Service Image

on:
  push:
    tags:
      - "service-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#service-v}" >> "$GITHUB_OUTPUT"

      # Build into the local daemon first so Trivy can gate the exact artifact
      # before it reaches GHCR. The push step below reuses the buildx cache.
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          load: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/duar:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/duar:latest

      - name: Scan image — block the release on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/duar:${{ steps.version.outputs.VERSION }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/duar:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/duar:latest
