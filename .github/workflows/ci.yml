name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly: surface CVEs published since the last push
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check service/src/ sdk/src/

      - name: Ruff format check
        run: uv run ruff format --check service/src/ sdk/src/

  sdk-test:
    name: SDK Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install SDK with dev deps
        run: cd sdk && uv sync --extra dev

      - name: Run tests with coverage
        run: cd sdk && uv run pytest -q --cov=duar_auth --cov-report=xml

  service-test:
    name: Service Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Test on the Python the service image ships (service/Dockerfile), which is
      # newer than the dev pin in .python-version.
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Whole workspace: the integration tests import the SDK.
      - name: Install workspace with dev deps
        run: uv sync --all-packages --extra dev

      # The suite needs no database or Redis, only a signing keypair.
      - name: Generate a throwaway JWT keypair
        run: |
          openssl genrsa -out "$RUNNER_TEMP/private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/private.pem" -pubout -out "$RUNNER_TEMP/public.pem"

      - name: Run tests
        env:
          JWT_PRIVATE_KEY_PATH: ${{ runner.temp }}/private.pem
          JWT_PUBLIC_KEY_PATH: ${{ runner.temp }}/public.pem
        run: cd service && uv run --no-sync pytest -q

  js-sdk:
    name: JS SDK Build & Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Node, install, build and test steps as publish-js-sdk.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/package-lock.json

      - name: Install dependencies
        working-directory: sdks
        run: npm ci

      - name: Build all packages
        working-directory: sdks
        run: npm run build

      - name: Run tests
        working-directory: sdks
        run: npm test

  admin:
    name: Admin Lint & Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint

      # tsc -b (type check) + vite build
      - name: Build
        working-directory: admin
        run: npm run build

  system-test:
    # Boots docker-compose.prod.yml (plus a test overlay: Dex to sign in
    # against, a TLS proxy in front) from an empty database and drives it from
    # outside: sign-in, sessions, the three authorization tiers, rate limits,
    # and both SDKs installed as an app would install them. Builds the service
    # and admin images on the way. Run locally with `make system-test`.
    name: System Tests (full stack)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/package-lock.json

      - name: Install pnpm
        run: npm install --global pnpm@11

      # Whole workspace: the tests drive the service through the Python SDK.
      - name: Install workspace with dev deps
        run: uv sync --all-packages --extra dev

      - name: Run the system tests
        run: ./system-tests/run.sh

      - name: Show the stack log
        if: failure()
        run: tail -n 400 system-tests/.work/stack.log || true

  tls-certs:
    # `make setup` certs must pass strict X.509 checks (Python 3.13+ verifies Redis
    # TLS that way). Runs weekly too, to catch a stricter OpenSSL before a release.
    name: TLS Certs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate and strictly verify the setup certs
        run: ./scripts/gen-tls-certs.sh "$RUNNER_TEMP/tls"

  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv workspace: the only Python lockfile is the root uv.lock, so scan from root.
      # Demos are excluded (not shipped); admin is covered by admin-container-scan.
      - name: Scan workspace dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: demo-authz,demo-proxy,pentest,admin
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  container-scan:
    name: Container Scan (Trivy)
    # Image CVEs track the advisory feed, not the diff — gate the shipped
    # artifact at release (publish-service.yml) and sweep for drift weekly,
    # rather than rebuilding on every push/PR and red-flagging unrelated merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build service image
        run: docker build -f service/Dockerfile -t daikon/duar:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: daikon/duar:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  admin-container-scan:
    name: Admin Container Scan (Trivy)
    # See container-scan: gated to release (publish-admin.yml) + weekly drift.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build admin image
        run: docker build -t daikon/duar-admin:ci admin/

      - name: Scan admin container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: daikon/duar-admin:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  all-checks:
    # The one status check branch protection requires. It fails unless every job
    # in `needs` succeeded, so a new gating job is added here, not in repo
    # settings. `always()` matters: a job skipped because one it needs failed
    # would otherwise count as passing.
    name: All Checks
    if: always() && github.event_name != 'schedule'
    needs: [lint, sdk-test, service-test, js-sdk, admin, system-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
