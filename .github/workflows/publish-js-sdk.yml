name: Publish JS SDK

on:
  push:
    tags:
      - 'js-sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # NPM_TOKEN: granular token with read/write on the @duar-auth scope. Needed
    # because npm Trusted Publishing can only be configured on packages that
    # already exist; once 1.0.0 is up, add sidxz/duar + this workflow as the
    # trusted publisher on each package, delete the token, and drop this env.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: sdks
        run: npm ci

      - name: Build all packages
        working-directory: sdks
        run: npm run build

      - name: Run tests
        working-directory: sdks
        run: npm test

      - name: Publish @duar-auth/js
        working-directory: sdks/js
        run: npm publish --provenance --access public

      - name: Publish @duar-auth/react
        working-directory: sdks/react
        run: npm publish --provenance --access public

      - name: Publish @duar-auth/nextjs
        working-directory: sdks/nextjs
        run: npm publish --provenance --access public
