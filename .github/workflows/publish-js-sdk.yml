name: Publish JS SDK

on:
  push:
    tags:
      - 'js-sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: sdks
        run: npm ci

      - name: Build all packages
        working-directory: sdks
        run: npm run build

      - name: Run tests
        working-directory: sdks
        run: npm test

      # NPM_TOKEN (granular, read/write on @duar-auth only) is scoped to the
      # publish steps so install/build/test never see it. Needed because npm
      # Trusted Publishing can only be configured on packages that already
      # exist; once 1.0.0 is up, add sidxz/duar + this workflow as the trusted
      # publisher on each package, delete the token, and drop these env lines.
      - name: Publish @duar-auth/js
        working-directory: sdks/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish @duar-auth/react
        working-directory: sdks/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Publish @duar-auth/nextjs
        working-directory: sdks/nextjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
