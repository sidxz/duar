version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Linter — each bump adds rules that fail CI (0.17 surfaced 318), so we
      # upgrade it deliberately in its own PR, not via grouped dependency bumps.
      - dependency-name: "ruff"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # Shipped npm packages only; the demos are not published.
  - package-ecosystem: npm
    directories:
      - /admin
      - /sdks
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /service
      - /admin
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
