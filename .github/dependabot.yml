version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Linter — each bump adds rules that fail CI (0.17 surfaced 318), so we
      # upgrade it deliberately in its own PR, not via grouped dependency bumps.
      - dependency-name: "ruff"
      # pentest/tools/schemathesis_scan.py drives the v3 CLI (see the pin in
      # pentest/requirements.txt). Lift with that script's v4 migration.
      - dependency-name: "schemathesis"
        versions: [">=4"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # Shipped npm packages only; the demos are not published.
  - package-ecosystem: npm
    directories:
      - /admin
      - /sdks
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 drops the JS compiler API: typescript-eslint (admin lint)
      # and tsup's declaration build (sdks) both fail on it. Lift once both
      # support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories:
      - /service
      - /admin
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
