[project]
name = "demo-mcp"
version = "0.1.0"
description = "Demo FastMCP server authorized by Duar (Duar MCP, human-driven dual auth)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "duar-auth",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
duar-auth = { path = "../sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
