[project]
name = "duar-service"
version = "1.5.2"
description = "Duar — FastAPI microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "authlib>=1.4.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "nh3>=0.2.14",
    "jinja2>=3.1",
    "geoip2fast>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Default rules (E4, E7, E9, F) plus bandit-derived security checks.
extend-select = ["S"]
ignore = ["S101"] # assert is fine: tests use it, and the service never runs with -O

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold placeholder tokens and secrets by design.
"tests/**" = ["S105", "S106"]
