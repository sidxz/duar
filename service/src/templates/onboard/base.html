<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Onboarding{% endblock %} — Duar</title>
<style>
@font-face{font-family:"Overused Grotesk";src:url({{ base_url }}/static/fonts/OverusedGrotesk-VF.woff2) format("woff2");font-weight:300 900;font-display:swap}
:root{
  --paper:#ffffff; --wash:#f5f5f5; --line:#e6e6e6; --ink:#0b0b0d; --muted:#6b6b71;
  --brand:#f43737; --brand-dark:#c42020; --brand-tint:#ffd1d1; --brand-wash:#fff1f1;
  --tile-fg:#c42020; --field:#ffffff; --danger-fg:#a31616;
  --ok-bg:#ecfdf5; --ok-line:#bbf7d0; --ok-fg:#166534; --col:420px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131316; --wash:#0a0a0b; --line:#27272a; --ink:#fafafa; --muted:#a1a1aa;
    --brand-tint:#4a1519; --brand-wash:#2a0f12; --tile-fg:#ffd1d1; --field:#0a0a0b; --danger-fg:#fca5a5;
    --ok-bg:#052e16; --ok-line:#14532d; --ok-fg:#86efac;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;background:var(--paper);color:var(--ink);
  font:400 1rem/1.5 "Overused Grotesk",ui-sans-serif,system-ui,sans-serif}
body.wide{--col:760px}
.mono{font-size:.6875rem;line-height:1;font-weight:500;text-transform:uppercase;letter-spacing:.12em}

.brand{display:none}
main{flex:1;display:flex;padding:2.5rem 1.25rem}
.col{width:100%;max-width:var(--col);margin:auto}
.lockup{display:flex;align-items:center;gap:.5rem;font-weight:500;font-size:1.25rem;letter-spacing:-.02em;margin-bottom:2rem}
.lockup svg{width:30px;height:30px}
.lockup .io{color:var(--muted)}
@media (min-width:880px){
  .brand{position:sticky;top:0;height:100vh;flex:0 0 clamp(300px,36vw,520px);display:flex;flex-direction:column;justify-content:space-between;
    padding:3rem;color:#fafafa;background:#0b0b0d;overflow:hidden;isolation:isolate}
  .brand::before{content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(55% 45% at 25% 15%,#4a1116 0%,transparent 70%),
               radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px) 0 0/22px 22px}
  .brand .lockup{font-size:2.25rem;margin:0}
  .brand .lockup svg{width:52px;height:52px}
  .brand .lockup .io{color:rgba(250,250,250,.45)}
  .brand .foot{color:#a1a1aa;font-size:.8125rem}
  .brand .foot a{color:#fafafa;text-decoration:none}
  .brand .foot a:hover{text-decoration:underline}
  main{padding:3rem}
  .lockup.mobile{display:none}
}

h1{font-size:1.75rem;line-height:1.15;font-weight:600;letter-spacing:-.02em;margin-bottom:.4rem}
h2{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.25rem}
.lede{color:var(--muted);margin-bottom:1.5rem}
.fine{color:var(--muted);font-size:.875rem}
.eyebrow{color:var(--muted);display:block;margin-bottom:.6rem}
.eyebrow.red{color:var(--brand)}
strong{font-weight:600;color:var(--ink)}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.flash{background:var(--brand-wash);border:1px solid var(--brand-tint);color:var(--danger-fg);padding:.7rem .9rem;border-radius:6px;margin-bottom:1.25rem;font-size:.9375rem}
.flash.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.1rem;border-radius:6px;
  border:1px solid transparent;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;
  background:var(--brand);color:#fff;transition:background .12s,border-color .12s}
.btn:hover{background:var(--brand-dark)}
.btn.secondary{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{background:var(--paper);border-color:var(--ink)}
.btn.wide{width:100%}
.btn.sm{padding:.45rem .8rem;font-size:.875rem}
.quiet{background:none;border:0;padding:0;font:inherit;font-size:.875rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.quiet:hover{color:var(--ink)}

label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.35rem}
input[type=text],input[type=email],select{width:100%;font:inherit;padding:.65rem .8rem;border:1px solid var(--line);
  border-radius:6px;background:var(--field);color:var(--ink)}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint);outline:none}
input::placeholder{color:var(--muted)}
input[readonly]{font-size:.9375rem;background:var(--wash)}
.inline{display:flex;gap:.5rem}
.inline input,.inline select{flex:1;min-width:0}
select.auto{width:auto}
.stack{margin-bottom:.85rem}

.provider{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem .95rem;margin-bottom:.6rem;
  border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-weight:500;text-decoration:none;
  transition:border-color .12s}
.provider:hover{border-color:var(--ink)}
.provider svg{width:20px;height:20px;flex:none}

.invite{border:1px solid var(--brand-tint);border-radius:8px;padding:1.25rem;margin-bottom:1.5rem}
.invite .who{display:flex;align-items:center;gap:.9rem;margin:.25rem 0 1.1rem}
.invite .who p{color:var(--muted);font-size:.9375rem}
.tile{width:48px;height:48px;border-radius:10px;background:var(--brand-wash);color:var(--tile-fg);
  font-weight:600;font-size:1.375rem;display:grid;place-items:center;flex:none}
.name{font-size:1.125rem;font-weight:600;letter-spacing:-.01em}

.ws{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-top:1px solid var(--line)}
.ws:first-of-type{border-top:0}
.ws .tile{width:36px;height:36px;font-size:1rem;border-radius:8px}
.ws .name{flex:1;font-size:1rem;font-weight:500}
.chip{color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:.3rem .45rem;font-size:.625rem}

details{margin-top:1.25rem;border-top:1px solid var(--line);padding-top:1rem}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400}
details[open] summary::after{content:"\2013"}
details .fine{margin:.15rem 0 .85rem}

.section{margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.section .fine{margin-bottom:.85rem}
.meta{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:.35rem 1rem;align-items:center}
.meta a,.meta button{color:var(--muted);font:inherit;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.meta a:hover,.meta button:hover{color:var(--ink)}
.meta .who{flex-basis:100%}
.meta form{display:inline}
.check{width:52px;height:52px;border-radius:50%;background:var(--ok-bg);border:1px solid var(--ok-line);display:grid;place-items:center;margin-bottom:1.25rem}
.check svg{width:26px;height:26px}

.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem}
.tabs a{font-size:.875rem;text-decoration:none;padding:.4rem .75rem;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tabs a.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.member{display:grid;grid-template-columns:auto 1fr auto auto;gap:.6rem .9rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0}
.member .tile{width:36px;height:36px;font-size:1rem;border-radius:8px}
.member .id{min-width:0}
.member .id .n{font-weight:500}
.member .id .e{color:var(--muted);font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member form.inline{gap:.4rem}
.member select{padding:.45rem .6rem;font-size:.875rem}
@media (max-width:560px){.member{grid-template-columns:auto 1fr}.member .act{grid-column:2/-1;display:flex;gap:.75rem;align-items:center}}
@media (min-width:561px){.member .act{display:contents}}
.pend{display:grid;grid-template-columns:1fr auto auto auto;gap:.75rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line);font-size:.9375rem}
.pend:first-of-type{border-top:0}
.pend .fine{white-space:nowrap}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media (max-width:640px){.twocol{grid-template-columns:1fr}}
.oneshot{border:1px solid var(--brand-tint);border-radius:8px;padding:1.25rem;margin-bottom:1.5rem;background:var(--brand-wash)}
.oneshot label{margin-top:.75rem}
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
<aside class="brand">
  <div></div>
  <div class="lockup">{% include "onboard/_mark.html" %}<span>Duar<span class="io">.io</span></span></div>
  <p class="foot"><a href="https://duar.io">duar.io</a></p>
</aside>
<main><div class="col">
<div class="lockup mobile">{% include "onboard/_mark.html" %}<span>Duar<span class="io">.io</span></span></div>
{% if flash %}<div class="flash{% if flash_ok %} ok{% endif %}">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
{% block footer %}{% endblock %}
</div></main>
</body>
</html>
